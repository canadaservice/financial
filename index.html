<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Immigration Paiement</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      rgba(0,0,0,.35),
      rgba(0,0,0,.35)
    ),
    url("background.jpg")
    center center /
    cover fixed
    no-repeat;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;
}

.box {

  width: 100%;

  max-width: 520px;

  background: #fff;

  border-radius: 18px;

  padding: 30px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);
}

.logo {

  display: block;

  width: 170px;

  max-width: 80%;

  margin:
    0 auto 20px;
}

h1 {

  text-align: center;

  margin:
    0 0 25px;

  color: #222;

  font-size: 25px;
}

label {

  display: block;

  margin-top: 15px;

  margin-bottom: 7px;

  font-weight: bold;

  color: #333;
}

select,
input {

  width: 100%;

  height: 48px;

  border:
    1px solid #ccc;

  border-radius: 10px;

  padding:
    0 13px;

  font-size: 16px;

  background: #fff;

  outline: none;
}

select:focus,
input:focus {

  border-color:
    #1687ff;

  box-shadow:
    0 0 0 2px
    rgba(22,135,255,.12);
}

.phone-row {

  display: flex;

  gap: 8px;
}

.prefix {

  width: 90px;

  flex-shrink: 0;

  background: #f4f4f4;

  text-align: center;

  font-weight: bold;
}

.phone {

  flex: 1;
}

.amount {

  margin-top: 20px;

  padding: 17px;

  border-radius: 12px;

  background: #f4f8fb;

  text-align: center;

  font-size: 19px;

  font-weight: bold;

  color: #1476c8;
}

.provider {

  margin-top: 10px;

  text-align: center;

  color: #777;

  font-size: 12px;
}

button {

  width: 100%;

  height: 52px;

  margin-top: 20px;

  border: 0;

  border-radius: 11px;

  background: #087fce;

  color: #fff;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

button:hover {

  background: #066aa9;
}

button:disabled {

  opacity: .6;

  cursor: not-allowed;
}

#result {

  min-height: 55px;

  margin-top: 20px;

  text-align: center;

  line-height: 1.5;

  font-size: 15px;
}

.status-box {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  font-weight: bold;
}

.status-pending {

  display: block;

  background: #fff8df;

  color: #8a6800;
}

.status-success {

  display: block;

  background: #e7f8ed;

  color: #15733a;
}

.status-failed {

  display: block;

  background: #fdeaea;

  color: #b02020;
}

.payment-link {

  display: none;

  margin-top: 15px;

  text-align: center;
}

.payment-link a {

  display: inline-block;

  padding:
    12px 18px;

  border-radius: 8px;

  background: #ff7900;

  color: #fff;

  text-decoration: none;

  font-weight: bold;
}

.small {

  margin-top: 12px;

  text-align: center;

  color: #777;

  font-size: 12px;
}

.otp-help {

  display: none;

  margin-top: 10px;

  padding: 12px;

  border-radius: 10px;

  background: #fff4df;

  color: #805500;

  font-size: 13px;

  line-height: 1.45;
}

</style>

</head>

<body>

<div class="box">

<img
  src="logo.png"
  class="logo"
  alt="Logo"
>

<h1>
  Immigration Service Paiement
</h1>

<label for="service">
  Service
</label>

<select id="service">

  <option value="biometrie">
    Données biométriques — 85 USD
  </option>

  <option value="langue">
    Test de langue — 150 USD
  </option>

  <option value="administratif">
    Frais administratifs — 220 USD
  </option>

  <option value="total">
    Paiement total — 520 USD
  </option>

</select>

<label for="country">
  Pays
</label>

<select id="country">

  <option value="BEN">
    Bénin
  </option>

  <option value="CIV">
    Côte d'Ivoire
  </option>

  <option value="BF">
    Burkina Faso
  </option>

  <option value="COG">
    Congo-Brazzaville
  </option>

  <option value="SEN">
    Sénégal
  </option>

  <option value="TGO">
    Togo
  </option>

  <option value="MLI">
    Mali
  </option>

  <option value="CMR">
    Cameroun
  </option>

  <option value="COD">
    R.D. Congo
  </option>

</select>

<label for="operator">
  Réseau Mobile Money
</label>

<select id="operator"></select>

<div
  id="otpHelp"
  class="otp-help"
></div>

<label for="phone">
  Numéro Mobile Money
</label>

<div class="phone-row">

  <input
    type="text"
    id="prefix"
    class="prefix"
    readonly
  >

  <input
    type="tel"
    id="phone"
    class="phone"
    placeholder="Exemple : 771740000"
    autocomplete="tel"
  >

</div>

<div
  id="displayAmount"
  class="amount"
>
  Montant à payer
</div>

<div
  id="providerText"
  class="provider"
></div>

<button
  id="payButton"
  type="button"
>
  Payer maintenant
</button>

<p id="result"></p>

<div
  id="statusBox"
  class="status-box"
></div>

<div
  id="paymentLink"
  class="payment-link"
>

  <a
    id="paymentLinkButton"
    href="#"
    target="_blank"
    rel="noopener"
  >
    Ouvrir le paiement
  </a>

</div>

<div class="small">

  Le paiement est sécurisé par le service immigration de votre pays.

</div>

</div>

<script>

const service =
  document.getElementById(
    "service"
  );

const country =
  document.getElementById(
    "country"
  );

const operator =
  document.getElementById(
    "operator"
  );

const prefix =
  document.getElementById(
    "prefix"
  );

const phone =
  document.getElementById(
    "phone"
  );

const displayAmount =
  document.getElementById(
    "displayAmount"
  );

const providerText =
  document.getElementById(
    "providerText"
  );

const payButton =
  document.getElementById(
    "payButton"
  );

const result =
  document.getElementById(
    "result"
  );

const statusBox =
  document.getElementById(
    "statusBox"
  );

const paymentLink =
  document.getElementById(
    "paymentLink"
  );

const paymentLinkButton =
  document.getElementById(
    "paymentLinkButton"
  );

const otpHelp =
  document.getElementById(
    "otpHelp"
  );

const services = {

  biometrie: 85,

  langue: 150,

  administratif: 220,

  total: 520

};

const fallbackCountries = {

  BEN: {

    name: "Bénin",

    prefix: "229",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "mtn",
        label: "MTN Bénin"
      },

      {
        value: "moov",
        label: "Moov Bénin"
      },

      {
        value: "celtiis",
        label: "Celtiis Bénin"
      }

    ]

  },

  CIV: {

    name: "Côte d'Ivoire",

    prefix: "225",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "mtn",
        label: "MTN Côte d'Ivoire"
      },

      {
        value: "moov",
        label: "Moov Côte d'Ivoire"
      },

      {
        value: "orange",
        label: "Orange Côte d'Ivoire"
      },

      {
        value: "wave",
        label: "Wave Côte d'Ivoire"
      }

    ]

  },

  BF: {

    name: "Burkina Faso",

    prefix: "226",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "moov",
        label: "Moov Burkina Faso"
      },

      {
        value: "orange",
        label: "Orange Burkina Faso"
      }

    ]

  },

  COG: {

    name: "Congo-Brazzaville",

    prefix: "242",

    currency: "XAF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "mtn",
        label: "MTN Congo"
      }

    ]

  },

  SEN: {

    name: "Sénégal",

    prefix: "221",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "orange",
        label: "Orange Sénégal"
      },

      {
        value: "wave",
        label: "Wave Sénégal"
      },

      {
        value: "free",
        label: "Free Sénégal"
      }

    ]

  },

  TGO: {

    name: "Togo",

    prefix: "228",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "togocom",
        label: "Togocom"
      },

      {
        value: "moov",
        label: "Moov Togo"
      }

    ]

  },

  MLI: {

    name: "Mali",

    prefix: "223",

    currency: "XOF",

    rate: 550,

    provider: "feexpay",

    networks: [

      {
        value: "orange",
        label: "Orange Mali"
      },

      {
        value: "moov",
        label: "Moov Mali"
      }

    ]

  },

  CMR: {

    name: "Cameroun",

    prefix: "237",

    currency: "XAF",

    rate: 550,

    provider: "sebpay",

    networks: [

      {
        value: "mtn",
        label: "MTN Mobile Money",
        slug: "mtn"
      },

      {
        value: "orange",
        label: "Orange Money",
        slug: "orange"
      }

    ]

  },

  COD: {

    name: "R.D. Congo",

    prefix: "243",

    currency: "CDF",

    rate: 2300,

    provider: "sebpay",

    networks: [

      {
        value: "airtel",
        label: "Airtel Money",
        slug: "airtel"
      },

      {
        value: "orange",
        label: "Orange Money",
        slug: "orange"
      },

      {
        value: "mpesa",
        label: "M-Pesa",
        slug: "mpesa"
      },

      {
        value: "vodacom",
        label: "Vodacom",
        slug: "vodacom"
      }

    ]

  }

};

let countries =
  {...fallbackCountries};

let paymentInProgress =
  false;

let statusTimer =
  null;

async function loadNetworks() {

  try {

    const response =
      await fetch(
        "/api/networks"
      );

    if (!response.ok)
      throw new Error(
        "networks"
      );

    const data =
      await response.json();

    Object.keys(data || {})
      .forEach(code => {

        if (data[code])
          countries[code] =
            data[code];

      });

  } catch (error) {

    console.warn(
      "Utilisation des réseaux de secours."
    );

  }

  updateCountry();

}

function updateCountry() {

  const data =
    countries[
      country.value
    ];

  operator.innerHTML = "";

  if (!data) {

    prefix.value = "";

    return;

  }

  prefix.value =
    "+" + data.prefix;

  (data.networks || [])
    .forEach(net => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        net.value;

      option.textContent =
        net.label;

      option.dataset.slug =
        net.slug ||
        net.value;

      option.dataset.otpRequired =
        net.otp_required
          ? "1"
          : "0";

      option.dataset.ussd =
        net.ussd_code ||
        "";

      operator.appendChild(
        option
      );

    });

  providerText.textContent =
    data.provider === "sebpay"

      ? "Paiement traité par SebPay pour ce pays."

      : "Paiement traité par FeexPay pour ce pays.";

  updateOtpHelp();

  updateAmount();

}

function updateOtpHelp() {

  const selected =
    operator.options[
      operator.selectedIndex
    ];

  if (
    selected &&
    selected.dataset.otpRequired === "1"
  ) {

    otpHelp.style.display =
      "block";

    otpHelp.textContent =
      selected.dataset.ussd

        ? `Cet opérateur demande une confirmation OTP. Composez ${selected.dataset.ussd} sur votre téléphone puis suivez les instructions de l'opérateur.`

        : "Cet opérateur peut demander une confirmation OTP. Suivez les instructions reçues sur votre téléphone.";

  } else {

    otpHelp.style.display =
      "none";

    otpHelp.textContent =
      "";

  }

}

function updateAmount() {

  const usd =
    services[
      service.value
    ];

  const data =
    countries[
      country.value
    ];

  if (!usd || !data)
    return;

  const amount =
    Math.round(
      usd * data.rate
    );

  displayAmount.textContent =
    "Montant à payer : " +
    amount.toLocaleString(
      "fr-FR"
    ) +
    " " +
    data.currency;

}

function getPhoneNumber() {

  let number =
    phone.value
      .trim()
      .replace(/\s+/g, "")
      .replace(/-/g, "")
      .replace(/^\+/, "");

  if (!number)
    return null;

  const data =
    countries[
      country.value
    ];

  if (!data)
    return null;

  if (
    number.startsWith(
      data.prefix
    )
  ) {

    number =
      number.substring(
        data.prefix.length
      );

  }

  if (
    number.startsWith("0")
  ) {

    number =
      number.substring(1);

  }

  if (!/^\d+$/.test(number))
    return null;

  if (
    number.length < 8 ||
    number.length > 10
  ) {

    return null;

  }

  return (
    data.prefix +
    number
  );

}

function resetStatus() {

  if (statusTimer) {

    clearInterval(
      statusTimer
    );

    statusTimer = null;

  }

  statusBox.className =
    "status-box";

  statusBox.textContent =
    "";

  paymentLink.style.display =
    "none";

}

function showStatus(
  status,
  message
) {

  const value =
    String(
      status || ""
    ).toUpperCase();

  statusBox.className =
    "status-box";

  if (
    value === "SUCCESSFUL" ||
    value === "SUCCESS" ||
    value === "APPROVED"
  ) {

    statusBox.classList.add(
      "status-success"
    );

    statusBox.textContent =
      "✓ Paiement confirmé.";

    result.style.color =
      "green";

    result.textContent =
      "Votre paiement a été confirmé avec succès.";

    return "SUCCESS";

  }

  if (
    value === "FAILED" ||
    value === "FAILURE" ||
    value === "CANCELLED" ||
    value === "REJECTED"
  ) {

    statusBox.classList.add(
      "status-failed"
    );

    statusBox.textContent =
      "✕ Paiement échoué ou annulé.";

    result.style.color =
      "red";

    result.textContent =
      message ||
      "Le paiement n'a pas été confirmé.";

    return "FAILED";

  }

  statusBox.classList.add(
    "status-pending"
  );

  statusBox.textContent =
    "⏳ Paiement en attente de confirmation...";

  result.style.color =
    "#8a6800";

  result.textContent =
    "Veuillez confirmer le paiement sur votre téléphone.";

  return "PENDING";

}

async function checkPaymentStatus(
  reference
) {

  if (!reference)
    return;

  try {

    const response =
      await fetch(
        "/api/payment-status/" +
        encodeURIComponent(
          reference
        )
      );

    const data =
      await response.json();

    if (!response.ok) {

      console.error(
        "Erreur statut:",
        data
      );

      return;

    }

    const finalStatus =
      showStatus(
        data.status,
        data.message
      );

    if (
      finalStatus === "SUCCESS" ||
      finalStatus === "FAILED"
    ) {

      if (statusTimer) {

        clearInterval(
          statusTimer
        );

        statusTimer = null;

      }

      paymentInProgress =
        false;

      payButton.disabled =
        false;

      payButton.textContent =
        "Payer maintenant";

    }

  } catch (error) {

    console.error(
      "Erreur vérification statut:",
      error
    );

  }

}

function startStatusPolling(
  reference
) {

  if (!reference)
    return;

  checkPaymentStatus(
    reference
  );

  statusTimer =
    setInterval(
      () =>
        checkPaymentStatus(
          reference
        ),
      3000
    );

}

async function payer() {

  if (paymentInProgress)
    return;

  resetStatus();

  const phoneNumber =
    getPhoneNumber();

  if (!phoneNumber) {

    result.style.color =
      "red";

    result.textContent =
      "Veuillez entrer un numéro de téléphone valide.";

    return;

  }

  const selectedCountry =
    country.value;

  const selectedOperator =
    operator.value;

  const selectedService =
    service.value;

  if (!selectedOperator) {

    result.style.color =
      "red";

    result.textContent =
      "Veuillez sélectionner votre réseau.";

    return;

  }

  if (
    !services[
      selectedService
    ]
  ) {

    result.style.color =
      "red";

    result.textContent =
      "Service de paiement invalide.";

    return;

  }

  paymentInProgress =
    true;

  payButton.disabled =
    true;

  payButton.textContent =
    "Traitement en cours...";

  result.style.color =
    "#333";

  result.textContent =
    "Connexion au serveur de paiement...";

  try {

    const response =
      await fetch(
        "/api/pay",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              phone:
                phoneNumber,

              service:
                selectedService,

              country:
                selectedCountry,

              operator:
                selectedOperator

            })

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(

        data.error ||
        data.message ||
        "Le serveur a refusé la demande."

      );

    }

    if (data.payment_url) {

      paymentLink.style.display =
        "block";

      paymentLinkButton.href =
        data.payment_url;

    }

    const normalizedStatus =
      String(
        data.status || ""
      ).toUpperCase();

    if (
      normalizedStatus ===
        "PENDING" ||
      normalizedStatus ===
        "ACCEPTED"
    ) {

      result.style.color =
        "#8a6800";

      result.textContent =
        "Demande de paiement envoyée. Vérifiez votre téléphone et confirmez le paiement.";

      showStatus(
        "PENDING",
        data.message
      );

      if (data.reference) {

        startStatusPolling(
          data.reference
        );

      }

    } else if (
      normalizedStatus ===
        "SUCCESSFUL" ||
      normalizedStatus ===
        "SUCCESS" ||
      normalizedStatus ===
        "APPROVED"
    ) {

      showStatus(
        data.status,
        data.message
      );

      paymentInProgress =
        false;

      payButton.disabled =
        false;

      payButton.textContent =
        "Payer maintenant";

    } else {

      showStatus(
        data.status,
        data.message
      );

      if (
        normalizedStatus ===
          "FAILED" ||
        normalizedStatus ===
          "FAILURE" ||
        normalizedStatus ===
          "REJECTED" ||
        normalizedStatus ===
          "CANCELLED"
      ) {

        paymentInProgress =
          false;

        payButton.disabled =
          false;

        payButton.textContent =
          "Payer maintenant";

      }

    }

  } catch (error) {

    console.error(
      "Erreur paiement:",
      error
    );

    result.style.color =
      "red";

    result.textContent =
      "❌ " +
      error.message;

    paymentInProgress =
      false;

    payButton.disabled =
      false;

    payButton.textContent =
      "Payer maintenant";

  }

}

country.addEventListener(
  "change",
  updateCountry
);

operator.addEventListener(
  "change",
  updateOtpHelp
);

service.addEventListener(
  "change",
  updateAmount
);

payButton.addEventListener(
  "click",
  payer
);

updateCountry();

updateAmount();

loadNetworks();

</script>

</body>

</html>
