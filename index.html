<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Paiement sécurisé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f7fb,
          #eef2f7
        );

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px;

      box-shadow:
        0 15px 45px rgba(
          0,
          0,
          0,
          0.10
        );
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo strong {
      font-size: 26px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 18px;
    }

    select,
    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px 15px;

      font-size: 16px;
      outline: none;

      background: #fff;
    }

    select:focus,
    input:focus {
      border-color: #111827;
      box-shadow:
        0 0 0 3px
        rgba(
          17,
          24,
          39,
          0.08
        );
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .prefix {
      width: 95px;
      background: #f3f4f6;
      font-weight: 600;
    }

    .amount-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;

      padding: 16px;
      margin-bottom: 20px;
    }

    .amount-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-label {
      color: #6b7280;
    }

    .amount-value {
      font-size: 23px;
      font-weight: 800;
      color: #111827;
    }

    .otp-box {
      display: none;

      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 14px;

      padding: 15px;
      margin-bottom: 18px;
    }

    .otp-box.visible {
      display: block;
    }

    .otp-info {
      color: #9a3412;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;

      padding: 16px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;

      background: #111827;
      color: #ffffff;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .result {
      display: none;

      margin-top: 20px;
      border-radius: 15px;
      padding: 17px;
    }

    .result.visible {
      display: block;
    }

    .result.pending {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .result.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .result.failed {
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .result-title {
      font-weight: 800;
      margin-bottom: 7px;
    }

    .result-message {
      font-size: 14px;
      line-height: 1.5;
    }

    .reference {
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .payment-link {
      display: none;

      margin-top: 15px;

      text-decoration: none;

      background: #111827;
      color: white;

      padding: 13px 15px;

      border-radius: 11px;

      text-align: center;
      font-weight: 700;
    }

    .payment-link.visible {
      display: block;
    }

    .spinner {
      display: inline-block;

      width: 17px;
      height: 17px;

      border: 2px solid
        rgba(
          255,
          255,
          255,
          0.4
        );

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;

      vertical-align: -3px;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .small {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 18px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      <strong>Paiement sécurisé</strong>
    </div>

    <div class="subtitle">
      Choisissez votre service et votre réseau
      de paiement.
    </div>

    <!-- SERVICE -->
    <div class="field">

      <label for="service">
        Service
      </label>

      <select id="service">

        <option value="">
          Sélectionner un service
        </option>

        <option value="biometrie">
          Biométrie — 1 USD
        </option>

        <option value="langue">
          Test de langue — 150 USD
        </option>

        <option value="administratif">
          Frais administratifs — 220 USD
        </option>

      </select>

    </div>

    <!-- PAYS -->
    <div class="field">

      <label for="country">
        Pays
      </label>

      <select id="country">

        <option value="">
          Sélectionner un pays
        </option>

        <option value="BEN">
          🇧🇯 Bénin
        </option>

        <option value="TGO">
          🇹🇬 Togo
        </option>

        <option value="CIV">
          🇨🇮 Côte d'Ivoire
        </option>

        <option value="CG">
          🇨🇬 Congo Brazzaville
        </option>

        <option value="SEN">
          🇸🇳 Sénégal
        </option>

        <option value="BF">
          🇧🇫 Burkina Faso
        </option>

        <option value="MLI">
          🇲🇱 Mali
        </option>

      </select>

    </div>

    <!-- RÉSEAU -->
    <div class="field">

      <label for="operator">
        Réseau
      </label>

      <select id="operator">

        <option value="">
          Sélectionner un réseau
        </option>

      </select>

    </div>

    <!-- TÉLÉPHONE -->
    <div class="field">

      <label for="phone">
        Numéro de téléphone
      </label>

      <div class="phone-row">

        <input
          id="prefix"
          class="prefix"
          type="text"
          value="+229"
          readonly
        >

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="01XXXXXXXX"
        >

      </div>

    </div>

    <!-- OTP -->
    <div
      id="otpBox"
      class="otp-box"
    >

      <div class="otp-info">
        <strong>Orange Burkina Faso</strong><br>
        Composez d'abord
        <strong>#144*4*6*montant#</strong>
        depuis votre téléphone Orange BF.
        Ensuite, saisissez ici le code OTP reçu.
      </div>

      <label for="otp">
        Code OTP
      </label>

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="8"
        placeholder="Entrez votre OTP"
      >

    </div>

    <!-- MONTANT -->
    <div class="amount-box">

      <div class="amount-line">

        <span class="amount-label">
          Montant à payer
        </span>

        <span
          id="amount"
          class="amount-value"
        >
          —
        </span>

      </div>

    </div>

    <!-- BOUTON -->
    <button
      id="payButton"
      type="button"
    >
      Payer maintenant
    </button>

    <!-- RÉSULTAT -->
    <div
      id="result"
      class="result"
    >

      <div
        id="resultTitle"
        class="result-title"
      ></div>

      <div
        id="resultMessage"
        class="result-message"
      ></div>

      <div
        id="reference"
        class="reference"
      ></div>

      <a
        id="paymentLink"
        class="payment-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Continuer le paiement
      </a>

    </div>

    <div class="small">
      Paiement traité par FeexPay.
    </div>

  </div>

</div>

<script>
"use strict";

// ----------------------------------------------------
// CONFIGURATION
// ----------------------------------------------------

const SERVICES = {
  biometrie: {
    name: "Biométrie",
    usd: 1
  },

  langue: {
    name: "Test de langue",
    usd: 150
  },

  administratif: {
    name: "Frais administratifs",
    usd: 220
  }
};

const RATES = {
  XOF: 550,
  XAF: 550
};

const NETWORKS = {
  BEN: {
    country: "Bénin",
    currency: "XOF",
    prefix: "229",

    operators: {
      mtn: {
        name: "MTN Bénin",
        length: 10,
        example: "0166000000",
        otp: false
      },

      moov: {
        name: "Moov Bénin",
        length: 10,
        example: "0163000000",
        otp: false
      },

      celtiis_bj: {
        name: "Celtiis Bénin",
        length: 10,
        example: "0140000000",
        otp: false
      },

      coris: {
        name: "Coris Bénin",
        length: 10,
        example: "01XXXXXXXX",
        otp: false
      }
    }
  },

  TGO: {
    country: "Togo",
    currency: "XOF",
    prefix: "228",

    operators: {
      togocom_tg: {
        name: "Togocom",
        length: 8,
        example: "66000000",
        otp: false
      },

      moov_tg: {
        name: "Moov Togo",
        length: 8,
        example: "90000000",
        otp: false
      }
    }
  },

  CIV: {
    country: "Côte d'Ivoire",
    currency: "XOF",
    prefix: "225",

    operators: {
      mtn_ci: {
        name: "MTN Côte d'Ivoire",
        length: 10,
        example: "6766000000",
        otp: false
      },

      moov_ci: {
        name: "Moov Côte d'Ivoire",
        length: 10,
        example: "XXXXXXXXXX",
        otp: false
      },

      wave_ci: {
        name: "Wave Côte d'Ivoire",
        length: 10,
        example: "XXXXXXXXXX",
        otp: false
      },

      orange_ci: {
        name: "Orange Money Côte d'Ivoire",
        length: 10,
        example: "0556786596",
        otp: false
      }
    }
  },

  CG: {
    country: "Congo Brazzaville",
    currency: "XAF",
    prefix: "242",

    operators: {
      mtn_cg: {
        name: "MTN Congo",
        length: 12,
        example: "676600000000",
        otp: false
      }
    }
  },

  SEN: {
    country: "Sénégal",
    currency: "XOF",
    prefix: "221",

    operators: {
      orange_sn: {
        name: "Orange Sénégal",
        length: 9,
        example: "771740000",
        otp: false
      },

      wave_sn: {
        name: "Wave Sénégal",
        length: 9,
        example: "771740000",
        otp: false
      },

      free_sn: {
        name: "Free Money Sénégal",
        length: 9,
        example: "771740000",
        otp: false
      }
    }
  },

  BF: {
    country: "Burkina Faso",
    currency: "XOF",
    prefix: "226",

    operators: {
      moov_bf: {
        name: "Moov Burkina Faso",
        length: 8,
        example: "70000000",
        otp: false
      },

      orange_bf: {
        name: "Orange Burkina Faso",
        length: 8,
        example: "70000000",
        otp: true
      },

      wave_bf: {
        name: "Wave Burkina Faso",
        length: 8,
        example: "70000000",
        otp: false
      }
    }
  },

  MLI: {
    country: "Mali",
    currency: "XOF",
    prefix: "223",

    operators: {
      orange_ml: {
        name: "Orange Mali",
        length: 8,
        example: "70000000",
        otp: false
      },

      moov_ml: {
        name: "Moov Mali",
        length: 8,
        example: "70000000",
        otp: false
      }
    }
  }
};

// ----------------------------------------------------
// ELEMENTS
// ----------------------------------------------------

const serviceEl =
  document.getElementById("service");

const countryEl =
  document.getElementById("country");

const operatorEl =
  document.getElementById("operator");

const prefixEl =
  document.getElementById("prefix");

const phoneEl =
  document.getElementById("phone");

const otpBox =
  document.getElementById("otpBox");

const otpEl =
  document.getElementById("otp");

const amountEl =
  document.getElementById("amount");

const payButton =
  document.getElementById("payButton");

const resultEl =
  document.getElementById("result");

const resultTitleEl =
  document.getElementById("resultTitle");

const resultMessageEl =
  document.getElementById("resultMessage");

const referenceEl =
  document.getElementById("reference");

const paymentLinkEl =
  document.getElementById("paymentLink");

// ----------------------------------------------------
// SERVICES
// ----------------------------------------------------

function updateAmount() {

  const service =
    SERVICES[serviceEl.value];

  const country =
    NETWORKS[countryEl.value];

  if (!service || !country) {
    amountEl.textContent = "—";
    return;
  }

  const rate =
    RATES[country.currency];

  const amount =
    Math.round(
      service.usd * rate
    );

  amountEl.textContent =
    `${amount.toLocaleString("fr-FR")} ${country.currency}`;
}

// ----------------------------------------------------
// PAYS
// ----------------------------------------------------

function updateCountry() {

  const country =
    NETWORKS[countryEl.value];

  operatorEl.innerHTML = "";

  const firstOption =
    document.createElement("option");

  firstOption.value = "";
  firstOption.textContent =
    "Sélectionner un réseau";

  operatorEl.appendChild(
    firstOption
  );

  prefixEl.value =
    country
      ? `+${country.prefix}`
      : "+229";

  if (!country) {
    phoneEl.placeholder =
      "Numéro de téléphone";

    updateAmount();
    return;
  }

  Object.entries(
    country.operators
  ).forEach(
    ([id, operator]) => {

      const option =
        document.createElement("option");

      option.value = id;
      option.textContent =
        operator.name;

      operatorEl.appendChild(
        option
      );
    }
  );

  const firstOperator =
    Object.values(
      country.operators
    )[0];

  phoneEl.placeholder =
    firstOperator
      ? firstOperator.example
      : "Numéro";

  phoneEl.value = "";

  otpBox.classList.remove("visible");
  otpEl.value = "";

  updateAmount();
}

// ----------------------------------------------------
// RÉSEAU
// ----------------------------------------------------

function updateOperator() {

  const country =
    NETWORKS[countryEl.value];

  const operator =
    country?.operators[
      operatorEl.value
    ];

  if (!operator) {
    otpBox.classList.remove(
      "visible"
    );

    return;
  }

  phoneEl.placeholder =
    operator.example;

  otpBox.classList.toggle(
    "visible",
    Boolean(operator.otp)
  );

  if (!operator.otp) {
    otpEl.value = "";
  }
}

// ----------------------------------------------------
// NORMALISATION FRONTEND
// ----------------------------------------------------

function getPhoneNumber() {

  const country =
    NETWORKS[countryEl.value];

  const operator =
    country?.operators[
      operatorEl.value
    ];

  if (!country || !operator) {
    throw new Error(
      "Sélectionnez le pays et le réseau."
    );
  }

  let digits =
    phoneEl.value.replace(
      /\D/g,
      ""
    );

  if (!digits) {
    throw new Error(
      "Veuillez saisir votre numéro."
    );
  }

  // Déjà international
  if (
    digits.startsWith(
      country.prefix
    )
  ) {

    const national =
      digits.slice(
        country.prefix.length
      );

    if (
      national.length !==
      operator.length
    ) {
      throw new Error(
        `Le numéro doit contenir ${operator.length} chiffres après le préfixe ${country.prefix}.`
      );
    }

    return digits;
  }

  // Numéro local
  if (
    digits.length !==
    operator.length
  ) {
    throw new Error(
      `Veuillez saisir ${operator.length} chiffres.`
    );
  }

  // Bénin : conserver 01
  if (
    countryEl.value === "BEN" &&
    !digits.startsWith("01")
  ) {
    throw new Error(
      "Au Bénin, le numéro doit commencer par 01."
    );
  }

  return country.prefix + digits;
}

// ----------------------------------------------------
// AFFICHAGE RÉSULTAT
// ----------------------------------------------------

function showResult(
  type,
  title,
  message,
  reference = ""
) {

  resultEl.className =
    `result visible ${type}`;

  resultTitleEl.textContent =
    title;

  resultMessageEl.textContent =
    message;

  referenceEl.textContent =
    reference
      ? `Référence : ${reference}`
      : "";
}

// ----------------------------------------------------
// PAYMENT URL
// ----------------------------------------------------

function showPaymentLink(url) {

  if (!url) {
    paymentLinkEl.classList.remove(
      "visible"
    );

    paymentLinkEl.href = "#";

    return;
  }

  paymentLinkEl.href = url;

  paymentLinkEl.classList.add(
    "visible"
  );
}

// ----------------------------------------------------
// BOUTON CHARGEMENT
// ----------------------------------------------------

function setLoading(loading) {

  payButton.disabled =
    loading;

  if (loading) {

    payButton.innerHTML =
      `<span class="spinner"></span>
       Traitement en cours...`;

  } else {

    payButton.textContent =
      "Payer maintenant";
  }
}

// ----------------------------------------------------
// VÉRIFICATION DU STATUT
// ----------------------------------------------------

let pollingTimer = null;

function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer = null;
  }
}

async function checkPaymentStatus(
  reference
) {

  if (!reference) return;

  try {

    const response =
      await fetch(
        `/api/payment-status/${encodeURIComponent(reference)}`
      );

    const data =
      await response.json();

    if (!data.success) {
      return;
    }

    const status =
      String(
        data.status || "PENDING"
      ).toUpperCase();

    if (
      [
        "SUCCESS",
        "SUCCESSFUL"
      ].includes(status)
    ) {

      stopPolling();

      showResult(
        "success",
        "Paiement réussi",
        data.message ||
          "Votre paiement a été confirmé.",
        reference
      );

      return;
    }

    if (
      [
        "FAILED",
        "FAILURE",
        "CANCELLED",
        "CANCELED",
        "REJECTED",
        "ERROR"
      ].includes(status)
    ) {

      stopPolling();

      showResult(
        "failed",
        "Paiement échoué",
        data.message ||
          "Le paiement n'a pas été confirmé.",
        reference
      );

      return;
    }

    showResult(
      "pending",
      "Paiement en attente",
      data.message ||
        "Nous attendons la confirmation du paiement.",
      reference
    );

  } catch (error) {

    console.error(
      "Erreur statut :",
      error
    );
  }
}

function startPolling(
  reference
) {

  stopPolling();

  let elapsed = 0;

  // Première vérification après 2 secondes
  setTimeout(
    () => {
      checkPaymentStatus(
        reference
      );
    },
    2000
  );

  pollingTimer =
    setInterval(
      () => {

        elapsed += 5000;

        checkPaymentStatus(
          reference
        );

        // Arrêt après 10 minutes
        if (
          elapsed >=
          10 * 60 * 1000
        ) {

          stopPolling();

          showResult(
            "pending",
            "Confirmation toujours en attente",
            "La transaction est toujours en cours. Vous pouvez consulter votre opérateur ou réessayer plus tard.",
            reference
          );
        }

      },
      5000
    );
}

// ----------------------------------------------------
// PAIEMENT
// ----------------------------------------------------

async function pay() {

  stopPolling();

  showPaymentLink(null);

  resultEl.className =
    "result";

  const service =
    serviceEl.value;

  const country =
    countryEl.value;

  const operator =
    operatorEl.value;

  if (!service) {

    showResult(
      "failed",
      "Information manquante",
      "Veuillez sélectionner le service."
    );

    return;
  }

  if (!country) {

    showResult(
      "failed",
      "Information manquante",
      "Veuillez sélectionner votre pays."
    );

    return;
  }

  if (!operator) {

    showResult(
      "failed",
      "Information manquante",
      "Veuillez sélectionner votre réseau de paiement."
    );

    return;
  }

  let phone;

  try {

    phone =
      getPhoneNumber();

  } catch (error) {

    showResult(
      "failed",
      "Numéro invalide",
      error.message
    );

    return;
  }

  const network =
    NETWORKS[country];

  const operatorConfig =
    network.operators[
      operator
    ];

  // OTP
  if (operatorConfig.otp) {

    const otp =
      otpEl.value.replace(
        /\D/g,
        ""
      );

    if (
      !/^\d{4,8}$/.test(otp)
    ) {

      showResult(
        "failed",
        "OTP requis",
        "Veuillez saisir le code OTP reçu."
      );

      return;
    }
  }

  setLoading(true);

  try {

    const body = {
      phone,
      service,
      country,
      operator
    };

    if (operatorConfig.otp) {
      body.otp =
        otpEl.value.replace(
          /\D/g,
          ""
        );
    }

    const response =
      await fetch(
        "/api/pay",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      await response.json();

    setLoading(false);

    if (!data.success) {

      showResult(
        "failed",
        "Paiement refusé",
        data.message ||
          "La demande de paiement a échoué.",
        data.reference || ""
      );

      return;
    }

    const status =
      String(
        data.status ||
        "PENDING"
      ).toUpperCase();

    // Paiement déjà réussi
    if (
      [
        "SUCCESS",
        "SUCCESSFUL"
      ].includes(status)
    ) {

      showResult(
        "success",
        "Paiement réussi",
        data.message ||
          "Votre paiement a été confirmé.",
        data.reference || ""
      );

      return;
    }

    // Paiement échoué directement
    if (
      [
        "FAILED",
        "FAILURE",
        "CANCELLED",
        "CANCELED",
        "REJECTED"
      ].includes(status)
    ) {

      showResult(
        "failed",
        "Paiement échoué",
        data.message ||
          "L'opérateur a refusé la transaction.",
        data.reference || ""
      );

      return;
    }

    // URL de paiement
    if (data.payment_url) {

      showPaymentLink(
        data.payment_url
      );

      showResult(
        "pending",
        "Paiement à confirmer",
        "Cliquez sur le bouton ci-dessous pour continuer le paiement.",
        data.reference || ""
      );

      // Vérification en arrière-plan
      if (data.reference) {

        startPolling(
          data.reference
        );
      }

      return;
    }

    // PENDING sans URL
    showResult(
      "pending",
      "Paiement en attente",
      data.message ||
        "La demande a été envoyée. Nous attendons la confirmation de l'opérateur.",
      data.reference || ""
    );

    if (data.reference) {

      startPolling(
        data.reference
      );
    }

  } catch (error) {

    setLoading(false);

    console.error(
      error
    );

    showResult(
      "failed",
      "Erreur",
      "Impossible de contacter le serveur de paiement."
    );
  }
}

// ----------------------------------------------------
// ÉVÉNEMENTS
// ----------------------------------------------------

serviceEl.addEventListener(
  "change",
  updateAmount
);

countryEl.addEventListener(
  "change",
  updateCountry
);

operatorEl.addEventListener(
  "change",
  updateOperator
);

payButton.addEventListener(
  "click",
  pay
);

// ----------------------------------------------------
// INITIALISATION
// ----------------------------------------------------

updateCountry();
updateOperator();
updateAmount();

</script>

</body>
</html>
