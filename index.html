<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Paiement Mobile Money</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      rgba(0,0,0,0.35),
      rgba(0,0,0,0.35)
    ),
    url("background.jpg")
    center center / cover
    fixed no-repeat;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;
}

.box {

  width: 100%;

  max-width: 520px;

  background: #ffffff;

  border-radius: 18px;

  padding: 30px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,0.25);
}

.logo {

  display: block;

  width: 170px;

  max-width: 80%;

  margin:
    0 auto 20px auto;
}

h1 {

  text-align: center;

  margin:
    0 0 25px 0;

  color: #222;

  font-size: 25px;
}

label {

  display: block;

  margin-top: 15px;

  margin-bottom: 7px;

  font-weight: bold;

  color: #333;
}

select,
input {

  width: 100%;

  height: 48px;

  border: 1px solid #ccc;

  border-radius: 10px;

  padding: 0 13px;

  font-size: 16px;

  background: #fff;

  outline: none;
}

select:focus,
input:focus {

  border-color: #1687ff;

  box-shadow:
    0 0 0 2px
    rgba(22,135,255,0.12);
}

.phone-row {

  display: flex;

  gap: 8px;
}

.prefix {

  width: 90px;

  flex-shrink: 0;

  background: #f4f4f4;

  text-align: center;

  font-weight: bold;
}

.phone {

  flex: 1;
}

.amount {

  margin-top: 20px;

  padding: 17px;

  border-radius: 12px;

  background: #f4f8fb;

  text-align: center;

  font-size: 19px;

  font-weight: bold;

  color: #1476c8;
}

button {

  width: 100%;

  height: 52px;

  margin-top: 20px;

  border: 0;

  border-radius: 11px;

  background: #087fce;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  transition:
    0.2s;
}

button:hover {

  background: #066aa9;
}

button:disabled {

  opacity: 0.6;

  cursor: not-allowed;
}

#result {

  min-height: 55px;

  margin-top: 20px;

  text-align: center;

  line-height: 1.5;

  font-size: 15px;
}

.status-box {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  font-weight: bold;
}

.status-pending {

  display: block;

  background: #fff8df;

  color: #8a6800;
}

.status-success {

  display: block;

  background: #e7f8ed;

  color: #15733a;
}

.status-failed {

  display: block;

  background: #fdeaea;

  color: #b02020;
}

.payment-link {

  display: none;

  margin-top: 15px;

  text-align: center;
}

.payment-link a {

  display: inline-block;

  padding: 12px 18px;

  border-radius: 8px;

  background: #ff7900;

  color: white;

  text-decoration: none;

  font-weight: bold;
}

.small {

  margin-top: 12px;

  text-align: center;

  color: #777;

  font-size: 12px;
}

</style>

</head>

<body>

<div class="box">

  <img
    src="logo.png"
    class="logo"
    alt="Logo"
  >

  <h1>
    Paiement Mobile Money
  </h1>

  <!-- SERVICE -->

  <label for="service">
    Service
  </label>

  <select id="service">

    <option value="biometrie">
      Données biométriques — 85 USD
    </option>

    <option value="langue">
      Test de langue — 150 USD
    </option>

    <option value="administratif">
      Frais administratifs — 220 USD
    </option>

    <option value="total">
      Paiement total — 520 USD
    </option>

  </select>


  <!-- PAYS -->

  <label for="country">
    Pays
  </label>

  <select id="country">

    <option value="BEN">
      Bénin
    </option>

    <option value="CIV">
      Côte d'Ivoire
    </option>

    <option value="BF">
      Burkina Faso
    </option>

    <option value="COG">
      Congo-Brazzaville
    </option>

    <option value="SEN">
      Sénégal
    </option>

    <option value="TGO">
      Togo
    </option>

    <option value="MLI">
      Mali
    </option>

  </select>


  <!-- RESEAU -->

  <label for="operator">
    Réseau Mobile Money
  </label>

  <select id="operator"></select>


  <!-- TELEPHONE -->

  <label for="phone">
    Numéro Mobile Money
  </label>

  <div class="phone-row">

    <input
      type="text"
      id="prefix"
      class="prefix"
      readonly
    >

    <input
      type="tel"
      id="phone"
      class="phone"
      placeholder="Exemple : 771740000"
      autocomplete="tel"
    >

  </div>


  <!-- MONTANT -->

  <div
    id="displayAmount"
    class="amount"
  >
    Montant à payer
  </div>


  <!-- BOUTON -->

  <button
    id="payButton"
    type="button"
  >
    Payer maintenant
  </button>


  <!-- RESULTAT -->

  <p id="result"></p>


  <!-- STATUT -->

  <div
    id="statusBox"
    class="status-box"
  ></div>


  <!-- LIEN PAYMENT URL -->

  <div
    id="paymentLink"
    class="payment-link"
  >

    <a
      id="paymentLinkButton"
      href="#"
      target="_blank"
      rel="noopener"
    >
      Ouvrir le paiement
    </a>

  </div>


  <div class="small">
    Le paiement est sécurisé par FeexPay.
  </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const service =
  document.getElementById(
    "service"
  );

const country =
  document.getElementById(
    "country"
  );

const operator =
  document.getElementById(
    "operator"
  );

const prefix =
  document.getElementById(
    "prefix"
  );

const phone =
  document.getElementById(
    "phone"
  );

const displayAmount =
  document.getElementById(
    "displayAmount"
  );

const payButton =
  document.getElementById(
    "payButton"
  );

const result =
  document.getElementById(
    "result"
  );

const statusBox =
  document.getElementById(
    "statusBox"
  );

const paymentLink =
  document.getElementById(
    "paymentLink"
  );

const paymentLinkButton =
  document.getElementById(
    "paymentLinkButton"
  );


/* =========================================================
   CONFIGURATION
========================================================= */

const countries = {

  BEN: {

    name: "Bénin",

    prefix: "229",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "mtn",
        label: "MTN Bénin"
      },

      {
        value: "moov",
        label: "Moov Bénin"
      },

      {
        value: "celtiis",
        label: "Celtiis Bénin"
      }

    ]
  },


  CIV: {

    name: "Côte d'Ivoire",

    prefix: "225",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "mtn",
        label: "MTN Côte d'Ivoire"
      },

      {
        value: "moov",
        label: "Moov Côte d'Ivoire"
      },

      {
        value: "orange",
        label: "Orange Côte d'Ivoire"
      },

      {
        value: "wave",
        label: "Wave Côte d'Ivoire"
      }

    ]
  },


  BF: {

    name: "Burkina Faso",

    prefix: "226",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "moov",
        label: "Moov Burkina Faso"
      },

      {
        value: "orange",
        label: "Orange Burkina Faso"
      }

    ]
  },


  COG: {

    name: "Congo-Brazzaville",

    prefix: "242",

    currency: "XAF",

    rate: 550,

    networks: [

      {
        value: "mtn",
        label: "MTN Congo"
      }

    ]
  },


  SEN: {

    name: "Sénégal",

    prefix: "221",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "orange",
        label: "Orange Sénégal"
      },

      {
        value: "wave",
        label: "Wave Sénégal"
      },

      {
        value: "free",
        label: "Free Sénégal"
      }

    ]
  },


  TGO: {

    name: "Togo",

    prefix: "228",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "togocom",
        label: "Togocom"
      },

      {
        value: "moov",
        label: "Moov Togo"
      }

    ]
  },


  MLI: {

    name: "Mali",

    prefix: "223",

    currency: "XOF",

    rate: 550,

    networks: [

      {
        value: "orange",
        label: "Orange Mali"
      },

      {
        value: "moov",
        label: "Moov Mali"
      }

    ]
  }

};


/* =========================================================
   SERVICES
========================================================= */

const services = {

  biometrie: 85,

  langue: 150,

  administratif: 220,

  total: 520

};


/* =========================================================
   VARIABLES
========================================================= */

let paymentInProgress =
  false;

let statusTimer =
  null;


/* =========================================================
   CHANGEMENT DE PAYS
========================================================= */

function updateCountry() {

  const selected =
    country.value;

  const data =
    countries[selected];

  operator.innerHTML = "";

  if (!data) {

    prefix.value = "";

    return;
  }

  prefix.value =
    "+" + data.prefix;

  data.networks.forEach(
    function(net) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        net.value;

      option.textContent =
        net.label;

      operator.appendChild(
        option
      );
    }
  );

  updateAmount();
}


/* =========================================================
   CALCUL MONTANT
========================================================= */

function updateAmount() {

  const selectedService =
    service.value;

  const usd =
    services[
      selectedService
    ];

  const data =
    countries[
      country.value
    ];

  if (!usd || !data) {
    return;
  }

  const amount =
    Math.round(
      usd * data.rate
    );

  displayAmount.textContent =
    "Montant à payer : " +
    amount.toLocaleString(
      "fr-FR"
    ) +
    " " +
    data.currency;
}


/* =========================================================
   TELEPHONE
========================================================= */

function getPhoneNumber() {

  let number =
    phone.value
      .trim()
      .replace(/\s+/g, "")
      .replace(/-/g, "")
      .replace(/^\+/, "");

  if (!number) {
    return null;
  }

  const data =
    countries[
      country.value
    ];

  if (!data) {
    return null;
  }

  const prefixNumber =
    data.prefix;

  /*
   * Si le client a déjà mis
   * l'indicatif international.
   */

  if (
    number.startsWith(
      prefixNumber
    )
  ) {

    number =
      number.substring(
        prefixNumber.length
      );
  }

  /*
   * Retirer un éventuel zéro
   * national au début.
   */



  if (
    !/^\d+$/.test(number)
  ) {

    return null;
  }

  if (
    number.length < 8 ||
    number.length > 10
  ) {

    return null;
  }

  return (
    prefixNumber +
    number
  );
}


/* =========================================================
   RESET AFFICHAGE
========================================================= */

function resetStatus() {

  if (statusTimer) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;
  }

  statusBox.className =
    "status-box";

  statusBox.textContent =
    "";

  paymentLink.style.display =
    "none";
}


/* =========================================================
   AFFICHAGE STATUT
========================================================= */

function showStatus(
  status,
  message
) {

  const value =
    String(
      status || ""
    ).toUpperCase();

  statusBox.className =
    "status-box";

  if (
    value ===
      "SUCCESSFUL" ||
    value ===
      "SUCCESS"
  ) {

    statusBox.classList.add(
      "status-success"
    );

    statusBox.textContent =
      "✓ Paiement confirmé.";

    result.style.color =
      "green";

    result.textContent =
      "Votre paiement a été confirmé avec succès.";

    return "SUCCESS";

  }


  if (
    value === "FAILED" ||
    value === "FAILURE" ||
    value === "CANCELLED"
  ) {

    statusBox.classList.add(
      "status-failed"
    );

    statusBox.textContent =
      "✕ Paiement échoué ou annulé.";

    result.style.color =
      "red";

    result.textContent =
      message ||
      "Le paiement n'a pas été confirmé.";

    return "FAILED";

  }


  statusBox.classList.add(
    "status-pending"
  );

  statusBox.textContent =
    "⏳ Paiement en attente de confirmation...";

  result.style.color =
    "#8a6800";

  result.textContent =
    "Veuillez confirmer le paiement sur votre téléphone.";

  return "PENDING";
}


/* =========================================================
   VERIFICATION DU STATUT
========================================================= */

async function checkPaymentStatus(
  reference
) {

  if (!reference) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/payment-status/" +
        encodeURIComponent(
          reference
        )
      );

    const data =
      await response.json();

    if (!response.ok) {

      console.error(
        "Erreur statut :",
        data
      );

      return;
    }

    const finalStatus =
      showStatus(
        data.status,
        data.message
      );

    /*
     * Paiement terminé :
     * on arrête le polling.
     */

    if (
      finalStatus ===
        "SUCCESS" ||
      finalStatus ===
        "FAILED"
    ) {

      if (statusTimer) {

        clearInterval(
          statusTimer
        );

        statusTimer =
          null;
      }

      payButton.disabled =
        false;

      payButton.textContent =
        "Payer maintenant";
    }

  } catch (error) {

    console.error(
      "Erreur vérification statut :",
      error
    );
  }
}


/* =========================================================
   DEMARRER LE SUIVI
========================================================= */

function startStatusPolling(
  reference
) {

  if (!reference) {
    return;
  }

  /*
   * Première vérification immédiate.
   */

  checkPaymentStatus(
    reference
  );

  /*
   * Puis toutes les 3 secondes.
   */

  statusTimer =
    setInterval(
      function() {

        checkPaymentStatus(
          reference
        );

      },
      3000
    );

}


/* =========================================================
   PAIEMENT
========================================================= */

async function payer() {

  if (
    paymentInProgress
  ) {
    return;
  }

  resetStatus();

  const phoneNumber =
    getPhoneNumber();

  if (!phoneNumber) {

    result.style.color =
      "red";

    result.textContent =
      "Veuillez entrer un numéro de téléphone valide.";

    return;
  }

  const selectedCountry =
    country.value;

  const selectedOperator =
    operator.value;

  const selectedService =
    service.value;

  if (!selectedOperator) {

    result.style.color =
      "red";

    result.textContent =
      "Veuillez sélectionner votre réseau.";

    return;
  }

  if (
    !services[
      selectedService
    ]
  ) {

    result.style.color =
      "red";

    result.textContent =
      "Service de paiement invalide.";

    return;
  }

  paymentInProgress =
    true;

  payButton.disabled =
    true;

  payButton.textContent =
    "Traitement en cours...";

  result.style.color =
    "#333";

  result.textContent =
    "Connexion au serveur de paiement...";

  try {

    const response =
      await fetch(
        "/api/pay",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              phone:
                phoneNumber,

              service:
                selectedService,

              country:
                selectedCountry,

              operator:
                selectedOperator
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Le serveur a refusé la demande."
      );
    }

    /*
     * FeexPay peut retourner
     * un payment_url pour certains réseaux.
     */

    if (
      data.payment_url
    ) {

      paymentLink.style.display =
        "block";

      paymentLinkButton.href =
        data.payment_url;
    }

    /*
     * Demande acceptée.
     */

    if (
      data.status ===
        "PENDING" ||
      data.status ===
        "ACCEPTED"
    ) {

      result.style.color =
        "#8a6800";

      result.textContent =
        "Demande de paiement envoyée. Vérifiez votre téléphone et confirmez le paiement.";

      showStatus(
        "PENDING",
        data.message
      );

      /*
       * Commencer la confirmation
       * automatique.
       */

      if (
        data.reference
      ) {

        startStatusPolling(
          data.reference
        );
      }

    }

    else if (
      data.status ===
        "SUCCESSFUL" ||
      data.status ===
        "SUCCESS"
    ) {

      showStatus(
        data.status,
        data.message
      );
    }

    else {

      showStatus(
        data.status,
        data.message
      );
    }

  } catch (error) {

    console.error(
      "Erreur paiement :",
      error
    );

    result.style.color =
      "red";

    result.textContent =
      "❌ " +
      error.message;

    payButton.disabled =
      false;

  }

}


/* =========================================================
   EVENEMENTS
========================================================= */

country.addEventListener(
  "change",
  function() {

    updateCountry();

  }
);


service.addEventListener(
  "change",
  function() {

    updateAmount();

  }
);


payButton.addEventListener(
  "click",
  payer
);


/* =========================================================
   INITIALISATION
========================================================= */

updateCountry();

updateAmount();

</script>

</body>

</html>
