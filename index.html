<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service de paiement</title>

<!-- FeexPay JavaScript SDK V2 -->
<script src="https://feexpay.me"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)), url("background.jpg") no-repeat center center;
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.logo {
  width: 100px;
  max-width: 100%;
  margin-bottom: 10px;
}

.title {
  font-weight: bold;
  font-size: 20px;
  margin-bottom: 18px;
}

.subtitle {
  font-size: 13px;
  color: #666;
  margin-bottom: 15px;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 15px;
  background: white;
}

input:focus,
select:focus {
  outline: none;
  border-color: #00bcd4;
}

.row {
  display: flex;
  gap: 6px;
}

.prefix {
  width: 32%;
  background: #eee;
  text-align: center;
}

.phone {
  width: 68%;
}

.amount-box {
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  background: #f4f4f4;
  font-weight: bold;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #00bcd4;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#result {
  margin-top: 15px;
  font-weight: bold;
  font-size: 14px;
  line-height: 1.5;
}

.notice {
  margin-top: 12px;
  font-size: 11px;
  color: #777;
  line-height: 1.4;
}

.footer {
  position: fixed;
  bottom: 8px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 11px;
  padding: 0 10px;
}

/* Conteneur FeexPay obligatoire */
#render {
  display: block; /* Laissé en visible pour éviter les blocages d'initialisation */
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="box">

  <img src="logo.png" class="logo" alt="Logo">

  <div class="title">
    Service de paiement
  </div>

  <div class="subtitle">
    Sélectionnez le service et votre moyen de paiement.
  </div>

  <!-- SERVICE -->
  <select id="service" onchange="updateAmount()">
    <option value="biometrie" data-usd="5">Données biométriques - 5 USD</option>
    <option value="langue" data-usd="150">Test de langue - 150 USD</option>
    <option value="administratif" data-usd="220">Droit administratif - 220 USD</option>
    <option value="total" data-usd="455">Tout payer - 455 USD</option>
  </select>

  <!-- PAYS -->
  <select id="country" onchange="updateCountry()">
    <option value="BJ">Bénin</option>
    <option value="TG">Togo</option>
    <option value="CI">Côte d'Ivoire</option>
    <option value="SN">Sénégal</option>
    <option value="ML">Mali</option>
    <option value="BF">Burkina Faso</option>
    <option value="CG">Congo-Brazzaville</option>
    <option value="CM" disabled>Cameroun - paiement indisponible</option>
    <option value="CD" disabled>RDC - paiement indisponible</option>
    <option value="GA" disabled>Gabon - paiement indisponible</option>
  </select>

  <!-- OPERATEUR -->
  <select id="operator" onchange="updatePaymentAvailability()"></select>

  <!-- TELEPHONE -->
  <div class="row">
    <input id="prefix" class="prefix" readonly>
    <input id="phone" class="phone" type="tel" inputmode="numeric" placeholder="Ex: 0142222197" maxlength="12">
  </div>

  <!-- MONTANT -->
  <div class="amount-box" id="displayAmount"></div>

  <!-- BOUTON -->
  <button id="payButton" onclick="payer()">Payer avec FeexPay</button>

  <!-- MESSAGE -->
  <p id="result"></p>

  <div class="notice">
    Le paiement est traité par FeexPay.
    Vérifiez attentivement les informations avant de confirmer.
  </div>

  <!-- Conteneur obligatoire FeexPay -->
  <div id="render"></div>

</div>

<div class="footer">
  © 2026 — Service de paiement sécurisé
</div>

<script>

/* =========================================================
   CONFIGURATION FEEXPAY
========================================================= */

// ⚠️ REMPLACEZ CES DEUX VALEURS PAR VOS CODES DE PRODUCTION SI VOUS PASSEZ EN LIVE
const FEEXPAY_SHOP_ID = "IYDzyrokhFsbjR6";
const FEEXPAY_API_KEY = "fp_kduKiG5WH1aUurqtDWszbXNpjZgzOvKEd9263XCme8gfyIdOu5zJRV93N4IgLWbc";

// Mettre "SANDBOX" pour vos tests et "LIVE" pour la production réelle
const FEEXPAY_MODE = "LIVE";

/* =========================================================
   TARIFS
========================================================= */
const services = {
  biometrie: { name: "Données biométriques", usd: 5 },
  langue: { name: "Test de langue", usd: 150 },
  administratif: { name: "Droit administratif", usd: 220 },
  total: { name: "Tout payer", usd: 455 }
};

/* =========================================================
   TAUX & DEVISE
========================================================= */
const rates = { XOF: 550 };
const DEFAULT_CURRENCY = "XOF";

/* =========================================================
   BASE DE DONNÉES PAYS
========================================================= */
const countries = {
  BJ: { name: "Benin", displayName: "Bénin", prefix: "229", currency: "XOF", networks: ["MTN", "MOOV", "CELTIIS", "CORIS"] },
  TG: { name: "Togo", displayName: "Togo", prefix: "228", currency: "XOF", networks: ["MOOV", "TOGOCOM"] },
  CI: { name: "Côte d'Ivoire", displayName: "Côte d'Ivoire", prefix: "225", currency: "XOF", networks: ["MTN", "ORANGE", "MOOV", "WAVE"] },
  SN: { name: "Senegal", displayName: "Sénégal", prefix: "221", currency: "XOF", networks: ["ORANGE", "WAVE", "FREE"] },
  ML: { name: "Mali", displayName: "Mali", prefix: "223", currency: "XOF", networks: ["ORANGE", "MOBICASH"] },
  BF: { name: "Burkina Faso", displayName: "Burkina Faso", prefix: "226", currency: "XOF", networks: ["ORANGE", "MOOV", "WAVE"] },
  CG: { name: "Congo-Brazzaville", displayName: "Congo-Brazzaville", prefix: "242", currency: "XAF", networks: ["MTN"] }
};

/* =========================================================
   VARIABLES ET ÉLÉMENTS D'INTERFACE
========================================================= */
let finalAmount = 0;
let currentReference = null;
let paymentInProgress = false;

const service = document.getElementById("service");
const country = document.getElementById("country");
const operator = document.getElementById("operator");
const prefix = document.getElementById("prefix");
const phone = document.getElementById("phone");
const displayAmount = document.getElementById("displayAmount");
const result = document.getElementById("result");
const payButton = document.getElementById("payButton");

/* =========================================================
   FONCTIONS LOGIQUES
========================================================= */

function updateCountry() {
  const selectedCountry = country.value;
  const data = countries[selectedCountry];

  operator.innerHTML = "";

  if (!data) {
    prefix.value = "";
    return;
  }

  prefix.value = "+" + data.prefix;

  data.networks.forEach(network => {
    const opt = document.createElement("option");
    opt.value = network;
    opt.textContent = network;
    operator.appendChild(opt);
  });

  updateAmount();
  updatePaymentAvailability();
}

function updateAmount() {
  const selectedService = service.value;
  const serviceData = services[selectedService];
  
  if (!serviceData) return;

  const amountUSD = serviceData.usd;
  finalAmount = amountUSD * rates.XOF;

  displayAmount.textContent = `Montant à payer : ${finalAmount.toLocaleString('fr-FR')} XOF`;
}

function updatePaymentAvailability() {
  payButton.disabled = false;
  result.textContent = "";
}

/* =========================================================
   FONCTION CRITIQUE DE TRAITEMENT DU PAIEMENT
========================================================= */
function payer() {
  let phoneNumber = phone.value.trim();
  
  if (!phoneNumber) {
    result.style.color = "red";
    result.textContent = "Veuillez entrer un numéro de téléphone valide.";
    return;
  }

  // Nettoyage complet des caractères superflus
  phoneNumber = phoneNumber.replace(/\s+/g, "").replace("+", "");

  // Si l'utilisateur saisit déjà l'indicatif 229 au début, on l'isole pour le traitement
  if (phoneNumber.startsWith("229")) {
    phoneNumber = phoneNumber.substring(3);
  }

  // Construction du numéro requis par l'API V2 (Doit donner : 22901xxxxxxxx)
  const prefixValue = countries[country.value].prefix;
  const finalPhoneNumber = prefixValue + phoneNumber;

  if (paymentInProgress) return;
  paymentInProgress = true;
  payButton.disabled = true;
  result.style.color = "#333";
  result.textContent = "Lancement de l'opération...";

  currentReference = "REF-" + Date.now() + "-" + Math.floor(Math.random() * 1000);

  try {
    // Initialisation de l'instance Payin
    const feexpay = new FeexPayPayin({
      shop_id: FEEXPAY_SHOP_ID,
      api_key: FEEXPAY_API_KEY,
      mode: FEEXPAY_MODE,
      container: "render"
    });

    // L'API V2 requiert impérativement les opérateurs en lettres minuscules ("mtn")
    const operatorValue = operator.value.toLowerCase();

    const paymentData = {
      amount: finalAmount,
      currency: DEFAULT_CURRENCY,
      country: country.value,
      operator: operatorValue, 
      phone_number: finalPhoneNumber, // Chaîne formatée : "2290142222197"
      reference: currentReference,
      callback_url: window.location.href,
      description: "Paiement Service - " + services[service.value].name
    };

    console.log("Paramètres envoyés au SDK :", paymentData);
